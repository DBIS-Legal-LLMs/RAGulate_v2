services:
  mongodb:
    image: mongo:7
    container_name: ragulate_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ollama:
    image: ollama/ollama:latest
    container_name: ragulate_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One-shot service: pulls the model once, then exits.
  # The model is stored in the shared ollama_data volume,
  # so it persists across restarts and this only re-runs
  # if the volume is wiped.
  ollama-init:
    image: ollama/ollama:latest
    container_name: ragulate_ollama_init
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
      volumes:
        - ollama_data:/root/.ollama
      environment:
        - OLLAMA_HOST=http://ollama:11434
      entrypoint: ["ollama", "pull", "qwen2.5:4b"]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragulate_backend_v2
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_started
      ollama:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - ".env"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]

volumes:
  mongo_data:
  hf_cache:
  ollama_data: